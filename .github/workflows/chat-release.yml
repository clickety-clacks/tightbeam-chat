name: Stage Chat release for approval

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  stage:
    name: Build and stage draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run release:assert-tag
      - run: npm run check
      - run: npm test
      - run: npm run test:release-watch
      - run: npm run build
      - run: npm run build:chat-server
      - run: npm run package:chat-release
      - name: Verify package identity before staging
        shell: bash
        run: |
          set -euo pipefail
          provenance=dist/chat-release/release-provenance.json
          tag="$(jq -er '.tag' "$provenance")"
          source_commit="$(jq -er '.sourceCommit' "$provenance")"
          asset_name="$(jq -er '.asset' "$provenance")"
          asset_sha256="$(jq -er '.sha256' "$provenance")"
          test "$tag" = "$GITHUB_REF_NAME"
          test "$source_commit" = "$GITHUB_SHA"
          test "$asset_name" = "tightbeam-chat-${GITHUB_REF_NAME}.tar.gz"
          [[ "$asset_sha256" =~ ^[a-f0-9]{64}$ ]]
          test "$(cat dist/chat-release/SHA256SUMS)" = "$asset_sha256  $asset_name"
          printf '%s  %s\n' "$asset_sha256" "dist/chat-release/$asset_name" | sha256sum --check --strict
      - run: npm run release:stage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Summarize the staged package
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          provenance=dist/chat-release/release-provenance.json
          tag="$(jq -er '.tag' "$provenance")"
          source_commit="$(jq -er '.sourceCommit' "$provenance")"
          asset_name="$(jq -er '.asset' "$provenance")"
          asset_sha256="$(jq -er '.sha256' "$provenance")"
          {
            echo "## Chat release package staged for approval"
            echo
            echo "- Tag: \`$tag\`"
            echo "- Source commit: \`$source_commit\`"
            echo "- Package: \`$asset_name\`"
            echo "- SHA-256: \`$asset_sha256\`"
            echo
            echo "The package, checksum, and provenance are attached to a draft release. Review the exact source and package hash, then publish that draft explicitly to make it available to Chat's update checker."
          } >> "$GITHUB_STEP_SUMMARY"
